name: Cross-platform Harness verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Canonical universal package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm 11.7.0
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Install Node 22.19.0
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Test, build, and verify canonical package
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm typecheck
          pnpm build
          pnpm pack --pack-destination ./dist
          node scripts/verify-package.mjs ./dist/dsh-missher-memory-0.1.3.tgz > ./dist/package-verification.json

      - name: Upload canonical universal package
        uses: actions/upload-artifact@v7
        with:
          name: dsh-missher-memory-universal
          if-no-files-found: error
          path: |
            dist/dsh-missher-memory-0.1.3.tgz
            dist/package-verification.json

  native-plugin:
    name: ${{ matrix.name }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Intel
            os: macos-15-intel
            platform: darwin-x64
            artifact: macos-intel
          - name: macOS Apple Silicon
            os: macos-15
            platform: darwin-arm64
            artifact: macos-apple-silicon
          - name: Windows x64
            os: windows-2025
            platform: win32-x64
            artifact: windows-x64
          - name: Linux x64
            os: ubuntu-24.04
            platform: linux-x64
            artifact: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Checkout DeepSeek Harness Desktop 0.3.6
        uses: actions/checkout@v6
        with:
          repository: Missher12/deepseek-harness-desktop
          ref: a52c03b7c59a454dae2ac50a53115e35e72e0980
          path: .harness-036
          persist-credentials: false

      - name: Install pnpm 11.7.0
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0

      - name: Install Node 22.19.0
        uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install and test plugin on native runner
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm typecheck

      - name: Download canonical universal package
        uses: actions/download-artifact@v8
        with:
          name: dsh-missher-memory-universal
          path: dist/universal

      - name: Verify canonical package on native runner
        run: node scripts/verify-package.mjs ./dist/universal/dsh-missher-memory-0.1.3.tgz > ./dist/package-verification.json

      - name: Build exact Harness CLI
        working-directory: .harness-036
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          pnpm install --frozen-lockfile
          pnpm run build:lib

      - name: Run native install and lifecycle smoke
        run: node scripts/native-smoke.mjs --platform ${{ matrix.platform }} --archive ./dist/universal/dsh-missher-memory-0.1.3.tgz --cli ./.harness-036/apps/cli/lib/bin.js > ./dist/native-smoke.json

      - name: Upload acceptance evidence
        uses: actions/upload-artifact@v7
        with:
          name: dsh-missher-memory-${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/universal/dsh-missher-memory-0.1.3.tgz
            dist/package-verification.json
            dist/native-smoke.json
